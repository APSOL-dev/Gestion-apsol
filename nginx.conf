# ------------------------------------------------------------------
# Cache-Control por tipo de archivo. El problema que resuelve: sin
# Cache-Control, nginx deja que el navegador cachee index.html y el
# service worker "a ojo" (heuristic caching) y la app se queda trabada
# en una version vieja despues de un deploy.
#
#   - index.html / sw.js / registerSW.js / workbox-*.js / manifest:
#     no-cache -> el navegador SIEMPRE revalida (con ETag el 304 es
#     gratis). Asi cada deploy se detecta al instante.
#   - /assets/*  (JS, CSS, fuentes, imagenes): llevan hash en el nombre,
#     cambian solos en cada build -> se pueden cachear "para siempre".
#
# El nombre de archivo con hash es lo que hace seguro el "immutable":
# si el contenido cambia, cambia la URL.
# ------------------------------------------------------------------
map $uri $asset_cache {
    default                            "no-cache";
    ~*\.webmanifest$                   "no-cache";
    ~*/sw\.js$                         "no-cache";
    ~*/registerSW\.js$                 "no-cache";
    ~*/workbox-[-\w]+\.js$             "no-cache";
    ~*\.html$                          "no-cache";
    ~*/assets/.+\.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$   "public, max-age=31536000, immutable";
    ~*/icons/.+\.(?:png|svg)$          "public, max-age=86400";
    ~*\.(?:png|svg|ico)$               "public, max-age=86400";
}

server {
    listen 80;

    # ------------------------------------------------------------------
    # Cabeceras de seguridad (se aplican a TODAS las respuestas, incluidas
    # las de error, gracias a "always"). La app es una SPA estatica que
    # habla directo con Supabase: no hay backend propio donde ponerlas.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache segun el tipo de archivo (ver el map de arriba). OJO: si algun
    # `location` de abajo agrega su propio `add_header`, deja de heredar
    # TODOS estos -> no poner add_header dentro de los location.
    add_header Cache-Control $asset_cache always;

    # Content-Security-Policy. Origenes permitidos, segun uso real de la app:
    #   connect-src : Supabase REST/Auth/Storage (https) + Realtime (wss),
    #                 webhook n8n de facturacion (bots.apsol-consultora.com.ar),
    #                 API de valores UVA (api.argentinadatos.com).
    #   style-src / font-src : Google Fonts (import en src/index.css).
    #   frame-src  : embeds de video del modulo Capacitacion (YouTube, Drive).
    #   media-src  : videos mp4 (link libre cargado en DB) + proxy Drive en Supabase.
    #   script-src 'self' : el build de Vite solo emite modulos same-origin,
    #                 no hay scripts inline (registerSW.js es un archivo aparte).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://bots.apsol-consultora.com.ar https://api.argentinadatos.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
